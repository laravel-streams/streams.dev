<div style="--col-span-default: span 1 / span 1;" class="col-[--col-span-default] flex">
    
    <div
        class="w-full grid gap-y-2"
    >
        
                    <div
                class="flex items-center justify-between gap-x-3"
            >
                                    <label
    class="inline-flex items-center gap-x-3" for="data.enabled"
>
    

    <span class="font-medium leading-6 text-gray-950">
        
        Enabled    </span>

    
</label>
                
                            </div>
        
                    <div
                class="grid gap-y-2"
            >
                <div>
        <button
            x-data="{
                state: $wire.entangle('data.enabled'),
            }"
            x-bind:aria-checked="(!! state).toString()"
            x-on:click="if (! false) state = ! state"
            x-bind:class="!! state ? 'bg-primary-600' : 'bg-gray-200'"
            class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent outline-none transition-colors duration-200 ease-in-out disabled:pointer-events-none disabled:opacity-70" aria-checked="false" id="data.enabled" role="switch" type="button" wire:loading.attr="disabled" wire:target="data.enabled"
        >
            <span
                class="pointer-events-none relative inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
                x-bind:class="{
                    'translate-x-5 rtl:-translate-x-5': !! state,
                    'translate-x-0': ! state,
                }"
            ></span>
        </button>
    </div>

                
                            </div>
            </div>
</div>
